<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ nombre }} — {{ hero_titulo }}</title>
  <link href="https://fonts.googleapis.com/css2?family={{ font_heading_url }}&family={{ font_body_url }}&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: {{ tokens.ink }};
      --paper: {{ tokens.paper }};
      --accent: {{ tokens.accent }};
      --muted: {{ tokens.muted }};
      --sand: {{ tokens.sand }};
      --radius: {{ tokens.radius }};
      --pad: clamp(16px, 4vw, 40px);
      --max: 960px;
      --font-heading: {{ tokens.font_heading }}, Georgia, serif;
      --font-body: {{ tokens.font_body }}, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
    }
    /* Solo el header puede ser sticky */
    header.top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--pad); border-bottom: 1px solid #e4dfd6;
      position: sticky; top: 0; z-index: 10;
      background: var(--paper);
    }
    .logo {
      font-family: var(--font-heading); letter-spacing: .16em;
      font-weight: 600; font-size: 1.35rem; text-decoration: none; color: var(--ink);
    }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: .72rem;
      letter-spacing: .08em; text-transform: uppercase; margin-left: 14px;
    }
    /* Flujo normal — sin absolute/fixed de contenido, sin animaciones de entrada */
    [data-section] {
      position: relative;
      display: block;
      width: 100%;
      clear: both;
      isolation: isolate;
      overflow: hidden;
      background: var(--paper);
    }
    [data-section].band { background: var(--sand); }
    [data-section].dark {
      background: var(--ink);
      color: #f0ebe3;
    }
    .inner { max-width: var(--max); margin: 0 auto; padding: clamp(48px, 8vw, 72px) var(--pad); }
    .hero .inner { padding: clamp(48px, 10vh, 88px) var(--pad); min-height: min(70svh, 600px); display: flex; flex-direction: column; justify-content: flex-end; }
    .brand-hero {
      font-family: var(--font-heading); letter-spacing: .18em; font-weight: 600;
      font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 12px;
    }
    h1 {
      font-family: var(--font-heading); font-weight: 500;
      font-size: clamp(1.4rem, 3vw, 1.85rem); max-width: 18ch; line-height: 1.2; margin-bottom: 12px;
    }
    h2 {
      font-family: var(--font-heading); font-weight: 500;
      font-size: clamp(1.4rem, 3vw, 1.9rem); text-align: center; margin-bottom: 14px;
    }
    .sub { color: rgba(240,235,227,.8); max-width: 40ch; margin-bottom: 22px; }
    /* UN solo acento para todos los botones primarios */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 50px; padding: 0 26px;
      background: var(--accent); color: var(--ink);
      font-size: .72rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; text-decoration: none; border: none; cursor: pointer;
      border-radius: var(--radius);
    }
    .proof {
      text-align: center; padding: 18px var(--pad);
      border-bottom: 1px solid #e4dfd6; font-size: .9rem; color: var(--muted);
    }
    .proof strong { color: var(--ink); font-weight: 600; }
    .dolores { list-style: none; padding: 0; max-width: 40ch; margin: 0 auto; }
    .dolores li { padding: 12px 0; border-bottom: 1px solid #e4dfd6; color: var(--muted); }
    .puente { text-align: center; margin-top: 22px; font-weight: 500; }
    .bens { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .ben { background: #fff; border: 1px solid #e4dfd6; padding: 20px; border-radius: var(--radius); }
    .ben h3 { font-family: var(--font-heading); font-weight: 500; margin-bottom: 8px; }
    .ben p { color: var(--muted); font-size: .92rem; }
    .tests { display: grid; gap: 14px; max-width: 52ch; margin: 0 auto; }
    blockquote { background: #fff; border: 1px solid #e4dfd6; padding: 18px; border-radius: var(--radius); }
    blockquote p { font-size: 1.02rem; margin-bottom: 10px; }
    cite { font-style: normal; font-size: .8rem; color: var(--muted); }
    .price-box { text-align: center; max-width: 28rem; margin: 0 auto; }
    .price { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600; margin: 8px 0 16px; }
    .incluye { list-style: none; padding: 0; text-align: left; margin: 0 auto 22px; max-width: 28ch; }
    .incluye li { padding: 10px 0; border-bottom: 1px solid #e4dfd6; color: var(--muted); }
    .garantia {
      margin-top: 14px; font-size: .82rem; color: var(--muted);
      letter-spacing: .02em;
    }
    .mid-cta { text-align: center; margin-top: 28px; }
    details { background: #fff; border: 1px solid #e4dfd6; padding: 14px 16px; margin-bottom: 10px; border-radius: var(--radius); }
    summary { cursor: pointer; font-weight: 500; }
    details p { margin-top: 8px; color: var(--muted); font-size: .92rem; }
    .cta-final .inner { text-align: center; }
    .cta-final h2 { color: #f0ebe3; }
    .cta-final .sub-cta { color: rgba(240,235,227,.75); max-width: 40ch; margin: 0 auto 20px; }
    footer.site-footer {
      text-align: center; padding: 28px var(--pad); font-size: .75rem;
      color: var(--muted); background: var(--paper);
    }
    footer.site-footer a { color: var(--muted); }
    @media (max-width: 640px) {
      .nav { display: none; }
      .hero .inner { min-height: auto; padding: 56px var(--pad) 48px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="logo" href="#">{{ nombre }}</a>
    <nav class="nav">
      <a href="#problema">Problema</a>
      <a href="#beneficios">Beneficios</a>
      <a href="#precio">Precio</a>
      <a href="#faq">FAQ</a>
    </nav>
  </header>
  {{ body | safe }}
</body>
</html>
