<section class="hero dark hero-split" id="hero" data-section="hero">
  <div class="inner split">
    <div class="split-copy">
      <div class="brand-hero">{{ nombre }}</div>
      <h1>{{ hero.titulo }}</h1>
      <p class="sub">{{ hero.bajada }}</p>
      <a class="btn" href="#precio">{{ hero.cta }}</a>
    </div>
    <div class="split-visual" aria-hidden="true">
      <div class="visual-panel">
        <p class="visual-mark">{{ nombre }}</p>
        <p class="visual-line">{{ hero.titulo }}</p>
      </div>
    </div>
  </div>
</section>
